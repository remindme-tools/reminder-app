# Runs every hour. The function itself decides who is due a message (7am in each person's time zone).
name: Send reminders
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminder function
        run: |
          curl --fail-with-body -sS -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/daily-reminders"
