# Manual test button for the daily-reminders function.
# pg_cron fires the function every minute; this workflow is kept only for manual testing.
name: Test reminder function (manual)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminder function
        run: |
          curl --fail-with-body -sS -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/daily-reminders"
